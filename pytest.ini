[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_tests.py
testpaths = apps
norecursedirs =
    .git
    .venv
    venv
    env
    frontend
    node_modules
    .next
    build
    dist
    staticfiles
    media
    playwright-report
    test-results
addopts = --strict-markers
